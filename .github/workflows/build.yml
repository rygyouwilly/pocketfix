name: Build Modern Waylith Mod Assembly

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Forces the runner to initialize the modern .NET 10 runtime

    - name: Compile Mod via SDK Engine
      shell: pwsh
      run: |
        dotnet build ModProject.csproj --configuration Release
        
    - name: Upload Compiled DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PocketMapShuttleLaunchFix-Assembly
        path: |
          **/Assemblies/PocketMapShuttleLaunchFix.dll
          **/bin/Release/**/*.dll
        if-no-files-found: error
